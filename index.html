<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yape - Panel de Configuración</title>
  
  <!-- Vinculación del Manifiesto PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#7B2E83">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://i.postimg.cc/W3DvJwTz/6.webp">

  <!-- CDN de la librería lectora de QR oficial -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            yape: "#7B2E83",
            yapeDark: "#5C1C6A",
            yapeBtn: "#8C3D99",
            yapeMint: "#10cbb4",
            yapeInk: "#3D3556"
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center bg-[#5C1C6A] p-4 font-sans">

  <!-- Contenedor Principal -->
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col justify-between min-h-[570px] relative">
    
    <!-- Encabezado morado de Yape -->
    <div class="bg-yape text-white px-5 py-6 text-center relative">
      <h1 class="font-bold text-xl tracking-wide">Yapear a un contacto</h1>
      <p class="text-xs text-purple-200 mt-1">Configura los datos del recibo</p>
      <button onclick="limpiarCampos()" class="absolute top-2 right-2 text-[10px] bg-red-600 hover:bg-red-700 text-white font-bold px-2 py-1 rounded">
        Resetear
      </button>
    </div>

    <!-- Formulario Editable -->
    <div class="px-6 py-4 flex-grow space-y-4">
      <div>
        <label class="block text-xs font-bold text-yapeInk mb-1 uppercase tracking-wider">Nombre del Destinatario</label>
        <!-- Fila de input con botón de escáner integrado a la derecha -->
        <div class="flex gap-2">
          <input id="loginNombre" type="text" placeholder="Ej. JUAN DE DIOS" class="flex-grow border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-yape/30 transition">
          <button onclick="abrirEscaner()" class="bg-yape hover:bg-yapeDark text-white p-3 rounded-xl flex items-center justify-center transition shadow-sm active:scale-95" title="Escanear Código QR">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
            </svg>
          </button>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-yapeInk mb-1 uppercase tracking-wider">Número de Celular</label>
        <input id="loginNumero" type="text" placeholder="Ej. 987 654 321" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-yape/30 transition">
      </div>

      <div>
        <label class="block text-xs font-bold text-yapeInk mb-1 uppercase tracking-wider">Monto (S/)</label>
        <input id="loginMonto" type="number" step="0.01" placeholder="200.00" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-yape/30 transition">
      </div>
    </div>

    <!-- Botón flotante/interior de Instalar App (Oculto por defecto) -->
    <div id="pwaContainer" class="px-6 pb-2 hidden">
      <button id="btnInstalar" class="w-full bg-yapeMint hover:bg-[#0eb39e] text-yapeInk py-2.5 rounded-xl font-bold text-xs uppercase tracking-wide transition flex items-center justify-center gap-2">
        📥 Descargar App Yape
      </button>
    </div>

    <!-- Botón de acción inferior -->
    <div class="p-6 bg-gray-50 border-t border-gray-100">
      <button onclick="generarYapeo()" class="w-full bg-yape hover:bg-yapeDark text-white py-4 rounded-xl font-bold text-base transition-all duration-200 shadow-md transform active:scale-95">
        Yapear 🚀
      </button>
    </div>

  </div>

  <!-- MODAL DEL ESCÁNER QR -->
  <div id="modalEscaner" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-xs rounded-2xl overflow-hidden shadow-2xl flex flex-col">
      <div class="bg-yape text-white px-4 py-3 flex justify-between items-center">
        <span class="font-bold text-sm tracking-wide">Escanear QR de Yape</span>
        <button onclick="cerrarEscaner()" class="text-white hover:text-red-200 text-sm font-bold bg-white/10 rounded-full w-7 h-7 flex items-center justify-center transition">✕</button>
      </div>
      <!-- Zona del Lector de Cámara -->
      <div class="p-4 bg-gray-100 flex flex-col items-center">
        <div id="lector" class="w-full aspect-square overflow-hidden rounded-xl border-2 border-dashed border-yape"></div>
        <p class="text-[11px] text-gray-500 mt-2 text-center">Apunta con la cámara trasera al código QR de la aplicación.</p>
      </div>
    </div>
  </div>

  <script>
    // Variables de control para el Escáner QR
    let html5Qrcode = null;

    // Lógica para procesar y aislar la etiqueta '59' (Nombre) del formato EMVCo de Yape
    function extraerNombreYape(cadenaQr) {
      let posicion = 0;
      while (posicion < cadenaQr.length) {
        if (posicion + 4 > cadenaQr.length) break;
        
        let campoId = cadenaQr.substring(posicion, posicion + 2);
        let longitud = parseInt(cadenaQr.substring(posicion + 2, posicion + 4));
        
        if (isNaN(longitud)) break;
        
        let valor = cadenaQr.substring(posicion + 4, posicion + 4 + longitud);
        
        // El ID '59' corresponde al Nombre del titular
        if (campoId === "59") {
          return valor;
        }
        
        posicion += 4 + longitud;
      }
      return null;
    }

    // Funciones para manejar el ciclo de vida del modal y la cámara
    function abrirEscaner() {
      document.getElementById('modalEscaner').classList.remove('hidden');
      
      // Instanciar la cámara en el div 'lector'
      html5Qrcode = new Html5Qrcode("lector");
      
      const config = { fps: 10, qrbox: { width: 220, height: 220 } };
      
      // Iniciar cámara usando por defecto la trasera (environment)
      html5Qrcode.start(
        { facingMode: "environment" },
        config,
        (decodedText) => {
          // Éxito: Procesamos el código leído
          const nombreTitular = extraerNombreYape(decodedText);
          
          if (nombreTitular) {
            document.getElementById('loginNombre').value = nombreTitular;
            cerrarEscaner();
          } else {
            // Si lee un QR pero no es un EMVCo con nombre, podemos usar todo el texto
            document.getElementById('loginNombre').value = decodedText.substring(0, 25);
            cerrarEscaner();
          }
        },
        (errorMessage) => {
          // Ignorar errores de escaneo continuos en consola
        }
      ).catch(err => {
        console.error("Error al iniciar la cámara: ", err);
        alert("No se pudo acceder a la cámara. Asegúrate de dar los permisos correspondientes.");
        cerrarEscaner();
      });
    }

    function cerrarEscaner() {
      document.getElementById('modalEscaner').classList.add('hidden');
      if (html5Qrcode) {
        html5Qrcode.stop().then(() => {
          html5Qrcode = null;
        }).catch(err => console.error("Error al detener la cámara: ", err));
      }
    }

    // Registro del Service Worker para habilitar la PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrado con éxito', reg))
          .catch(err => console.error('Error al registrar Service Worker', err));
      });
    }

    // Lógica para detectar e instalar la Aplicación Web
    let deferredPrompt;
    const pwaContainer = document.getElementById('pwaContainer');
    const btnInstalar = document.getElementById('btnInstalar');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      pwaContainer.classList.remove('hidden');
    });

    btnInstalar.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      console.log(`User response to the install prompt: ${outcome}`);
      deferredPrompt = null;
      pwaContainer.classList.add('hidden');
    });

    window.addEventListener('appinstalled', () => {
      console.log('¡La aplicación de Yape se instaló correctamente!');
      pwaContainer.classList.add('hidden');
    });

    // Código original de carga y generación
    document.addEventListener("DOMContentLoaded", () => {
      if(localStorage.getItem("yape_nombre")) {
        document.getElementById("loginNombre").value = localStorage.getItem("yape_nombre");
        document.getElementById("loginNumero").value = localStorage.getItem("yape_numero");
        document.getElementById("loginMonto").value = localStorage.getItem("yape_monto");
      }
    });

    function limpiarCampos() {
      localStorage.clear();
      document.getElementById("loginNombre").value = "";
      document.getElementById("loginNumero").value = "";
      document.getElementById("loginMonto").value = "";
      alert("Configuración reseteada.");
    }

    function generarYapeo() {
      const nombre = document.getElementById("loginNombre").value.trim() || "JUAN DE DIOS";
      const numero = document.getElementById("loginNumero").value.trim() || "*** *** 025";
      const monto = document.getElementById("loginMonto").value.trim() || "200.00";
      
      const operacionAuto = Math.floor(10000000 + Math.random() * 90000000).toString();

      const ahora = new Date();
      const meses = ["ene.", "feb.", "mar.", "abr.", "may.", "jun.", "jul.", "ago.", "sep.", "oct.", "nov.", "dic."];
      let horas = ahora.getHours();
      const minutos = String(ahora.getMinutes()).padStart(2, '0');
      const ampm = horas >= 12 ? 'p. m.' : 'a. m.';
      horas = horas % 12 || 12;

      const fechaFinal = `${ahora.getDate()} ${meses[ahora.getMonth()]} ${ahora.getFullYear()}`;
      const horaFinal = `${String(horas).padStart(2, '0')}:${minutos} ${ampm}`;

      localStorage.setItem("yape_nombre", nombre);
      localStorage.setItem("yape_numero", numero);
      localStorage.setItem("yape_monto", parseFloat(monto).toFixed(2));
      localStorage.setItem("yape_operacion", operacionAuto);
      localStorage.setItem("yape_fecha", fechaFinal);
      localStorage.setItem("yape_hora", horaFinal);

      sessionStorage.setItem("admin_session", "active");

      window.location.href = "recibo.html"; 
    }
  </script>
</body>
</html>

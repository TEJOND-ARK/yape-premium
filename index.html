<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yapear - Confirmación</title>
  <link rel="stylesheet" href="./Yapear - Demo_files/primeicons.css">
  <link rel="stylesheet" href="./Yapear - Demo_files/styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            yape: "#7B2E83",
            yapeDark: "#5C1C6A",
            yapeBtn: "#8C3D99",
            yapeMint: "#10cbb4",
            yapeInk: "#3D3556"
          },
          keyframes: {
            shimmer: {
              '0%': { transform: 'translateX(-150%)' },
              '50%': { transform: 'translateX(150%)' },
              '100%': { transform: 'translateX(150%)' }
            }
          },
          animation: {
            shimmer: 'shimmer 3.5s infinite'
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen flex flex-col items-center justify-start bg-[#5C1C6A] p-4 font-sans relative">

  <!-- BOTÓN SECRETO E INVISIBLE EN LA ESQUINA SUPERIOR DERECHA PARA ENTRAR AL LOGIN -->
  <a id="btnAcceder" href="login.html" class="absolute top-0 right-0 w-12 h-12 opacity-0 cursor-default z-50"></a>

  <!-- ================= FORMULARIO DE EDICIÓN (SOLO SI INICIAS SESIÓN) ================= -->
  <div id="editorPanel" class="hidden w-full max-w-sm bg-white rounded-2xl shadow-xl p-5 mb-6 border-2 border-yape text-yapeInk z-50">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-md font-bold text-yape">Modificar Recibo</h2>
      <button onclick="cerrarSesion()" class="text-xs text-red-500 font-bold hover:underline">Salir de edición</button>
    </div>
    
    <div class="space-y-3 text-xs">
      <div>
        <label class="block font-semibold text-gray-600">Nombre del Destinatario</label>
        <input id="editNombre" type="text" class="w-full border border-gray-300 rounded-lg p-2 mt-1 focus:outline-none focus:ring-1 focus:ring-yape">
      </div>
      <div>
        <label class="block font-semibold text-gray-600">Número de Celular</label>
        <input id="editNumero" type="text" class="w-full border border-gray-300 rounded-lg p-2 mt-1 focus:outline-none focus:ring-1 focus:ring-yape">
      </div>
      <div>
        <label class="block font-semibold text-gray-600">Monto (S/)</label>
        <input id="editMonto" type="number" step="0.01" class="w-full border border-gray-300 rounded-lg p-2 mt-1 focus:outline-none focus:ring-1 focus:ring-yape">
      </div>
      <div>
        <label class="block font-semibold text-gray-600">Nro. de Operación</label>
        <input id="editOperacion" type="text" class="w-full border border-gray-300 rounded-lg p-2 mt-1 focus:outline-none focus:ring-1 focus:ring-yape">
      </div>
      <button onclick="actualizarRecibo()" class="w-full bg-yape text-white py-2 rounded-lg font-bold hover:bg-yapeDark transition">
        Guardar Cambios
      </button>
    </div>
  </div>

  <!-- ================= VISTA DEL RECIBO DIGITAL ================= -->
  <div class="w-full max-w-sm bg-transparent rounded-2xl overflow-hidden">
    <div class="px-4 py-3">
      
      <!-- ================= SECCIÓN SUPERIOR: FOTO DINÁMICA DEL PERSONAJE HISTÓRICO ================= -->
      <div class="relative w-full rounded-2xl overflow-hidden mb-4 shadow-md">
        <!-- El banner dinámico cambia de personaje según el monto -->
        <img id="bannerHistorial" src="" alt="Personaje Histórico" class="w-full h-auto object-contain transition-all duration-300">
        <!-- Brillo dinámico sobre el personaje -->
        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-white/10 to-transparent -translate-x-full animate-shimmer pointer-events-none"></div>
      </div>

      <!-- Tarjeta del Recibo -->
      <div class="bg-white rounded-2xl shadow-md p-5">
        <div class="flex justify-between items-center">
          <h1 class="text-[#863C95] font-bold text-[20px]">¡Yapeaste!</h1>
          <span class="text-yapeMint font-semibold flex items-center text-[14px] cursor-pointer">
            <i class="pi pi-share-alt mr-2"></i> COMPARTIR
          </span>
        </div>

        <div class="mt-4">
          <div class="flex items-baseline">
            <p class="text-yapeInk text-3xl font-bold mr-1">S/</p>
            <p id="montoFinal" class="text-yapeInk text-5xl font-bold tracking-tight">0.00</p>
          </div>

          <p id="nombreDestino" class="text-yapeInk text-xl font-bold my-2">CARGANDO...</p>

          <div class="flex items-center gap-1 text-gray-500 font-semibold text-[13px] mt-1">
            <i class="pi pi-calendar"></i>
            <span id="fechaActual">-- ---. ----</span>
            <span class="mx-1">|</span>
            <i class="pi pi-clock"></i>
            <span id="horaActual">--:-- --. --.</span>
          </div>
          <hr class="border-gray-200 my-3">
        </div>

        <!-- Datos de Transacción -->
        <div class="space-y-2 text-[14px] pb-2">
          <div class="flex justify-between">
            <p class="text-[#3e364e]">Nro. de celular</p>
            <p class="text-[#3e364e] font-bold" id="numeroDestino">*** *** ***</p>
          </div>
          <div class="flex justify-between">
            <p class="text-[#3e364e]">Destino</p>
            <p class="text-[#3e364e] font-bold">Yape</p>
          </div>
          <div class="flex justify-between">
            <p class="text-[#3e364e]">Nro. de operación</p>
            <p class="text-[#3e364e] font-bold" id="numeroOperacion">00000000</p>
          </div>
        </div>
      </div>

      <!-- ================= SECCIÓN INFERIOR: PUBLICIDAD DE ABAJO ESTÁTICA ================= -->
      <div class="mt-4 rounded-2xl overflow-hidden p-4 bg-[#4A1153] shadow-md">
        <div class="text-sm font-semibold text-white mb-3 flex justify-between items-center">
          <span>Más en Yape</span>
          <span class="text-black rounded-md px-2 text-[11px] bg-[#f5c035] py-0.5 font-bold">Nuevo</span>
        </div>
        <!-- Tu imagen de publicidad fija de abajo -->
        <div class="rounded-xl overflow-hidden">
          <img src="./Yapear - Demo_files/banner_publicitario.png" alt="Publicidad Yape" class="w-full h-auto object-cover" onerror="this.src='https://i.postimg.cc/W3DvJwTz/6.webp'">
        </div>
      </div>

    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Si ya hay una sesión de admin, mostrar el panel
      if (sessionStorage.getItem("admin_session") === "active") {
        document.getElementById("editorPanel").classList.remove("hidden");
        document.getElementById("btnAcceder").classList.add("hidden"); 
      }

      cargarDatos();

      // Configuración de fecha y hora del sistema
      const ahora = new Date();
      const meses = ["ene.", "feb.", "mar.", "abr.", "may.", "jun.", "jul.", "ago.", "sep.", "oct.", "nov.", "dic."];
      let horas = ahora.getHours();
      const minutos = String(ahora.getMinutes()).padStart(2, '0');
      const ampm = horas >= 12 ? 'p. m.' : 'a. m.';
      horas = horas % 12 || 12;

      document.getElementById("fechaActual").textContent = `${ahora.getDate()} ${meses[ahora.getMonth()]} ${ahora.getFullYear()}`;
      document.getElementById("horaActual").textContent = `${String(horas).padStart(2, '0')}:${minutos} ${ampm}`;
    });

    function cargarDatos() {
      const monto = parseFloat(localStorage.getItem("yape_monto") || "200.00");
      const nombre = localStorage.getItem("yape_nombre") || "JUAN DE DIOS";
      const numero = localStorage.getItem("yape_numero") || "*** *** 025";
      const operacion = localStorage.getItem("yape_operacion") || "25764402";

      document.getElementById("montoFinal").textContent = monto.toFixed(2);
      document.getElementById("nombreDestino").textContent = nombre.toUpperCase();
      document.getElementById("numeroDestino").textContent = numero;
      document.getElementById("numeroOperacion").textContent = operacion;

      document.getElementById("editNombre").value = nombre;
      document.getElementById("editNumero").value = numero;
      document.getElementById("editMonto").value = monto.toFixed(2);
      document.getElementById("editOperacion").value = operacion;

      asignarBannerPersonaje(monto);
    }

    function asignarBannerPersonaje(monto) {
      const imgElement = document.getElementById("bannerHistorial");
      
      if (monto >= 0.1 && monto <= 19.99) {
        imgElement.src = "./10_soles-removebg-preview.png";
      } else if (monto >= 20.00 && monto <= 49.99) {
        imgElement.src = "./20_soles-removebg-preview.png";
      } else if (monto >= 50.00 && monto <= 99.99) {
        imgElement.src = "./50_soles-removebg-preview.png";
      } else if (monto >= 100.00 && monto <= 199.99) {
        imgElement.src = "./100_soles-removebg-preview.png";
      } else if (monto >= 200.00 && monto <= 1000.00) {
        imgElement.src = "./200_soles-removebg-preview.png";
      } else {
        imgElement.src = "./200_soles-removebg-preview.png";
      }
    }

    function actualizarRecibo() {
      localStorage.setItem("yape_nombre", document.getElementById("editNombre").value);
      localStorage.setItem("yape_numero", document.getElementById("editNumero").value);
      localStorage.setItem("yape_monto", parseFloat(document.getElementById("editMonto").value).toFixed(2));
      localStorage.setItem("yape_operacion", document.getElementById("editOperacion").value);
      
      cargarDatos();
    }

    function cerrarSesion() {
      sessionStorage.removeItem("admin_session");
      window.location.reload(); 
    }
  </script>
</body>
</html>

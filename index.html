<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yape - Panel de Configuración</title>
  
  <!-- Vinculación del Manifiesto PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#7B2E83">
  
  <!-- Configuración nativa para iOS (Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Yape">
  <link class="apple-touch-icon" href="https://i.postimg.cc/W3DvJwTz/6.webp">

  <!-- CDN de la librería lectora de QR oficial -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- SDKs de Firebase v9 Compat (App, Firestore y AUTH) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            yape: "#7B2E83",
            yapeDark: "#5C1C6A",
            yapeBtn: "#8C3D99",
            yapeMint: "#10cbb4",
            yapeInk: "#3D3556"
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center bg-[#5C1C6A] p-4 font-sans">

  <!-- 1. PANTALLA DE LOGIN (Se muestra por defecto si no estás autenticado) -->
  <div id="seccionLogin" class="w-full max-w-sm bg-white rounded-2xl shadow-2xl overflow-hidden p-6 space-y-4">
    <div class="text-center">
      <img src="https://i.postimg.cc/W3DvJwTz/6.webp" alt="Yape" class="w-16 h-16 mx-auto rounded-2xl shadow-md mb-3">
      <h2 class="text-xl font-bold text-yapeInk">Iniciar Sesión</h2>
      <p class="text-xs text-gray-500 mt-1">Accede para configurar y escanear QRs</p>
    </div>
    
    <div class="space-y-3">
      <div>
        <label class="block text-xs font-bold text-yapeInk mb-1 uppercase">Correo Electrónico</label>
        <input id="loginEmail" type="email" placeholder="ejemplo@weboscura.com" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-yape/30 transition">
      </div>
      <div>
        <label class="block text-xs font-bold text-yapeInk mb-1 uppercase">Contraseña</label>
        <input id="loginPassword" type="password" placeholder="••••••••" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-yape/30 transition">
      </div>
      <button onclick="iniciarSesionFirebase()" class="w-full bg-yape hover:bg-yapeDark text-white py-3.5 rounded-xl font-bold text-sm transition shadow-md active:scale-95">
        Ingresar 🔓
      </button>
    </div>
  </div>

  <!-- 2. CONTENEDOR PRINCIPAL DEL PANEL (Oculto hasta que te loguees) -->
  <div id="panelPrincipal" class="w-full max-w-sm bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col justify-between min-h-[570px] relative hidden">
    
    <!-- Encabezado con opción de Cerrar Sesión -->
    <div class="bg-yape text-white px-5 py-6 text-center relative">
      <button onclick="cerrarSesionFirebase()" class="absolute top-2 left-2 text-[10px] bg-white/20 hover:bg-white/30 text-white font-bold px-2 py-1 rounded">
        Salir 🚪
      </button>
      <h1 class="font-bold text-xl tracking-wide">Yapear a un contacto</h1>
      <p class="text-xs text-purple-200 mt-1">Configura los datos del recibo</p>
      <button onclick="limpiarCampos()" class="absolute top-2 right-2 text-[10px] bg-red-600 hover:bg-red-700 text-white font-bold px-2 py-1 rounded">
        Resetear
      </button>
    </div>

    <!-- Formulario Editable -->
    <div class="px-6 py-4 flex-grow space-y-4">
      <div>
        <label class="block text-xs font-bold text-yapeInk mb-1 uppercase tracking-wider">Nombre del Destinatario</label>
        <div class="flex gap-2">
          <input id="loginNombre" type="text" placeholder="Ej. JUAN DE DIOS" class="flex-grow border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-yape/30 transition">
          <button onclick="abrirEscaner()" class="bg-yape hover:bg-yapeDark text-white p-3 rounded-xl flex items-center justify-center transition shadow-sm active:scale-95" title="Escanear Código QR">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
            </svg>
          </button>
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-yapeInk mb-1 uppercase tracking-wider">Número de Celular</label>
        <input id="loginNumero" type="text" placeholder="Ej. 987 654 321" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-yape/30 transition">
      </div>

      <div>
        <label class="block text-xs font-bold text-yapeInk mb-1 uppercase tracking-wider">Monto (S/)</label>
        <input id="loginMonto" type="number" step="0.01" placeholder="200.00" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-yape/30 transition">
      </div>
    </div>

    <!-- Botón de Instalar App (Se mostrará automáticamente si el dispositivo es compatible) -->
    <div id="pwaContainer" class="px-6 pb-2 hidden">
      <button id="btnInstalar" class="w-full bg-yapeMint hover:bg-[#0eb39e] text-yapeInk py-2.5 rounded-xl font-bold text-xs uppercase tracking-wide transition flex items-center justify-center gap-2">
        📥 Descargar App Yape
      </button>
    </div>

    <!-- Botón de acción inferior -->
    <div class="p-6 bg-gray-50 border-t border-gray-100">
      <button onclick="generarYapeo()" class="w-full bg-yape hover:bg-yapeDark text-white py-4 rounded-xl font-bold text-base transition-all duration-200 shadow-md transform active:scale-95">
        Yapear 🚀
      </button>
    </div>

  </div>

  <!-- MODAL DEL ESCÁNER QR -->
  <div id="modalEscaner" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-xs rounded-2xl overflow-hidden shadow-2xl flex flex-col">
      <div class="bg-yape text-white px-4 py-3 flex justify-between items-center">
        <span class="font-bold text-sm tracking-wide">Escanear QR de Yape</span>
        <button onclick="cerrarEscaner()" class="text-white hover:text-red-200 text-sm font-bold bg-white/10 rounded-full w-7 h-7 flex items-center justify-center transition">✕</button>
      </div>
      <div class="p-4 bg-gray-100 flex flex-col items-center">
        <div id="lector" class="w-full aspect-square overflow-hidden rounded-xl border-2 border-dashed border-yape"></div>
        <p class="text-[11px] text-gray-500 mt-2 text-center">Apunta con la cámara trasera al código QR de la aplicación.</p>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN DE TU BASE DE DATOS FIREBASE
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyBJKdcy6awuDMuBDOlhGiNLRYqjTzPdx_E",
      authDomain: "web-anonima-d7b3c.firebaseapp.com",
      projectId: "web-anonima-d7b3c",
      storageBucket: "web-anonima-d7b3c.firebasestorage.app",
      messagingSenderId: "212970847778",
      appId: "1:212970847778:web:4d9783171719912dc9147b",
      measurementId: "G-SGL2WSXBN2"
    };

    // Inicializar Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore(); // MUDADO A FIRESTORE SEGÚN TUS REGLAS
    const auth = firebase.auth();

    let html5Qrcode = null;

    // Escuchador de estado de autenticación (Detecta si ya estabas logueado)
    auth.onAuthStateChanged((user) => {
      if (user) {
        // Usuario logueado: mostrar panel, ocultar login
        document.getElementById("seccionLogin").classList.add("hidden");
        document.getElementById("panelPrincipal").classList.remove("hidden");
      } else {
        // Sin login: mostrar login, ocultar panel
        document.getElementById("seccionLogin").classList.remove("hidden");
        document.getElementById("panelPrincipal").classList.add("hidden");
      }
    });

    // Función para iniciar sesión en Firebase Auth
    function iniciarSesionFirebase() {
      const email = document.getElementById("loginEmail").value.trim();
      const pass = document.getElementById("loginPassword").value;

      if (!email || !pass) {
        alert("Por favor completa todos los campos.");
        return;
      }

      auth.signInWithEmailAndPassword(email, pass)
        .then((userCredential) => {
          console.log("Sesión iniciada:", userCredential.user.email);
        })
        .catch((error) => {
          alert("Error al ingresar: " + error.message);
        });
    }

    // Función para cerrar sesión
    function cerrarSesionFirebase() {
      auth.signOut().then(() => {
        alert("Sesión cerrada.");
      });
    }

    // Extrae el ID único de cuenta y los datos crudos del formato EMVCo
    function decodificarQRCompleto(cadenaQr) {
      try {
        let idUnicoCuenta = null;
        let nombreQr = null;
        let celularQr = null;

        cadenaQr = cadenaQr.trim();

        if (cadenaQr.startsWith("000201")) {
          let index = 0;
          while (index < cadenaQr.length) {
            let tag = cadenaQr.substring(index, index + 2);
            let longitud = parseInt(cadenaQr.substring(index + 2, index + 4));
            if (isNaN(longitud) || longitud <= 0) break;
            let valor = cadenaQr.substring(index + 4, index + 4 + longitud);

            if (tag === "39") {
              idUnicoCuenta = valor.trim();
            }
            if (tag === "59") {
              // Corrección: ya no fuerza a mayúsculas desde el QR descifrado
              nombreQr = valor.trim();
            }
            if (["26", "27", "28", "29", "30"].includes(tag)) {
              let matchCelular = valor.match(/9\d{8}/);
              if (matchCelular) {
                celularQr = matchCelular[0];
              }
            }
            index += 4 + longitud;
          }
        }

        return {
          idUnico: idUnicoCuenta,
          nombre: nombreQr,
          celular: celularQr
        };
      } catch (e) {
        console.error("Error decodificando QR", e);
        return null;
      }
    }

    function abrirEscaner() {
      document.getElementById('modalEscaner').classList.remove('hidden');
      html5Qrcode = new Html5Qrcode("lector");
      const config = { fps: 15, qrbox: { width: 220, height: 220 } };
      
      html5Qrcode.start(
        { facingMode: "environment" },
        config,
        async (decodedText) => {
          let datosQr = decodificarQRCompleto(decodedText);
          
          if (datosQr && datosQr.idUnico) {
            cerrarEscaner();
            
            // CONSULTA A CLOUD FIRESTORE (De acuerdo a tus reglas)
            db.collection("QRs").doc(datosQr.idUnico).get().then((doc) => {
              if (doc.exists) {
                let datosGuardados = doc.data();
                document.getElementById('loginNombre').value = datosGuardados.nombre;
                
                let num = datosGuardados.celular;
                if (num) {
                  document.getElementById('loginNumero').value = `${num.substring(0,3)} ${num.substring(3,6)} ${num.substring(6,9)}`;
                }
              } else {
                setTimeout(() => {
                  let nombreSugerido = (datosQr.nombre && datosQr.nombre !== "YAPERO") ? datosQr.nombre : "";
                  
                  let realNombre = prompt(`¡Nuevo código detectado!\nEscribe el NOMBRE REAL de este Yape:`, nombreSugerido);
                  if (realNombre && realNombre.trim() !== "") {
                    let realCelular = prompt(`Escribe el NÚMERO DE CELULAR de ${realNombre}:`, "");
                    
                    if (realCelular) {
                      realCelular = realCelular.replace(/\s+/g, '');
                    }

                    // GUARDADO EN CLOUD FIRESTORE (Corrección: Guarda exactamente como lo ingresas en el prompt)
                    db.collection("QRs").doc(datosQr.idUnico).set({
                      nombre: realNombre.trim(),
                      celular: realCelular ? realCelular.trim() : ""
                    }).then(() => {
                      alert("¡Datos guardados con éxito en Firestore!");
                      document.getElementById('loginNombre').value = realNombre.trim();
                      if (realCelular) {
                        document.getElementById('loginNumero').value = `${realCelular.substring(0,3)} ${realCelular.substring(3,6)} ${realCelular.substring(6,9)}`;
                      }
                    }).catch(e => {
                      alert("Error de permisos en Firestore. Revisa tus reglas.");
                      console.error(e);
                    });
                  }
                }, 300);
              }
            }).catch(err => {
              console.error("Error al conectar con Firestore: ", err);
              document.getElementById('loginNombre').value = datosQr.nombre || "YAPERO";
            });

          } else {
            // Corrección: ya no se fuerza .toUpperCase() en el fallback de decodificación
            document.getElementById('loginNombre').value = decodedText.substring(0, 25);
            cerrarEscaner();
          }
        },
        (errorMessage) => {}
      ).catch(err => {
        console.error("Error de cámara: ", err);
        alert("No se pudo iniciar la cámara.");
        cerrarEscaner();
      });
    }

    function cerrarEscaner() {
      document.getElementById('modalEscaner').classList.add('hidden');
      if (html5Qrcode) {
        html5Qrcode.stop().then(() => {
          html5Qrcode = null;
        }).catch(err => console.error("Error al detener la cámara: ", err));
      }
    }

    // ====================================================
    // REGISTRO DE SERVICE WORKER & COMPORTAMIENTO INSTALABLE
    // ====================================================
    let eventoInstalacion = null;

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log("Service Worker corriendo perfectamente."))
          .catch(err => console.error("Error registrando SW: ", err));
      });
    }

    // Escucha el evento del sistema que detecta que se puede instalar
    window.addEventListener('beforeinstallprompt', (e) => {
      // Previene que el navegador muestre su pop-up predeterminado de inmediato
      e.preventDefault();
      // Guardamos el evento para dispararlo cuando presionen tu botón de instalar
      eventoInstalacion = e;
      
      // Hacemos visible el contenedor de tu botón personalizado
      const pwaContainer = document.getElementById('pwaContainer');
      if (pwaContainer) {
        pwaContainer.classList.remove('hidden');
      }
    });

    // Acción de instalación al presionar tu botón "Descargar App Yape"
    const btnInstalar = document.getElementById('btnInstalar');
    if (btnInstalar) {
      btnInstalar.addEventListener('click', async () => {
        if (!eventoInstalacion) {
          alert("¡La app ya está instalada o tu navegador no soporta instalaciones automáticas! Si estás en iPhone, usa la opción 'Compartir -> Añadir a pantalla de inicio'.");
          return;
        }
        // Mostramos el aviso nativo de instalación
        eventoInstalacion.prompt();
        // Esperamos la elección del usuario
        const { outcome } = await eventoInstalacion.userChoice;
        console.log(`Elección de instalación del usuario: ${outcome}`);
        // Limpiamos la variable
        eventoInstalacion = null;
        // Volvemos a ocultar el contenedor
        document.getElementById('pwaContainer').classList.add('hidden');
      });
    }

    // Ocultar botón si la app ya fue instalada exitosamente
    window.addEventListener('appinstalled', () => {
      console.log('¡Aplicación instalada exitosamente en el sistema!');
      document.getElementById('pwaContainer').classList.add('hidden');
      eventoInstalacion = null;
    });

    // Carga de datos locales
    document.addEventListener("DOMContentLoaded", () => {
      if(localStorage.getItem("yape_nombre")) {
        document.getElementById("loginNombre").value = localStorage.getItem("yape_nombre");
        document.getElementById("loginNumero").value = localStorage.getItem("yape_numero");
        document.getElementById("loginMonto").value = localStorage.getItem("yape_monto");
      }
    });

    // Corrección: limpiarCampos() para que se reinicien las variables locales correctamente
    function limpiarCampos() {
      localStorage.clear();
      document.getElementById("loginNombre").value = "";
      document.getElementById("loginNumero").value = "";
      document.getElementById("loginMonto").value = "";
      alert("Configuración reseteada.");
    }

    function generarYapeo() {
      const nombre = document.getElementById("loginNombre").value.trim() || "JUAN DE DIOS";
      const numero = document.getElementById("loginNumero").value.trim() || "*** *** 025";
      const monto = document.getElementById("loginMonto").value.trim() || "200.00";
      
      const operacionAuto = Math.floor(10000000 + Math.random() * 90000000).toString();
      const ahora = new Date();
      const meses = ["ene.", "feb.", "mar.", "abr.", "may.", "jun.", "jul.", "ago.", "sep.", "oct.", "nov.", "dic."];
      let horas = ahora.getHours();
      const minutos = String(ahora.getMinutes()).padStart(2, '0');
      const ampm = horas >= 12 ? 'p. m.' : 'a. m.';
      horas = horas % 12 || 12;

      localStorage.setItem("yape_nombre", nombre);
      localStorage.setItem("yape_numero", numero);
      localStorage.setItem("yape_monto", parseFloat(monto).toFixed(2));
      localStorage.setItem("yape_operacion", operacionAuto);
      localStorage.setItem("yape_fecha", `${ahora.getDate()} ${meses[ahora.getMonth()]} ${ahora.getFullYear()}`);
      localStorage.setItem("yape_hora", `${String(horas).padStart(2, '0')}:${minutos} ${ampm}`);

      sessionStorage.setItem("admin_session", "active");
      window.location.href = "recibo.html"; 
    }
  </script>
</body>
</html>

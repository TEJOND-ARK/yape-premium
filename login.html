<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gray-950 px-4">
  <div class="w-full max-w-sm bg-white p-6 rounded-2xl shadow-xl">
    <h2 class="text-xl font-bold text-[#7B2E83] text-center mb-4">Acceso Editor</h2>
    
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-1">Contraseña</label>
        <input id="adminPass" type="password" placeholder="••••••••" class="w-full border border-gray-300 rounded-xl px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-purple-600 text-sm">
      </div>
      
      <p id="errorMessage" class="text-red-500 text-xs hidden">Contraseña errónea.</p>

      <button onclick="verificarPassword()" class="w-full bg-[#7B2E83] text-white py-2.5 rounded-xl font-bold hover:bg-purple-800 transition">
        Ingresar a Editar
      </button>
    </div>
  </div>

  <script>
    function verificarPassword() {
      const pass = document.getElementById("adminPass").value;
      // Define aquí la contraseña que desees
      if (pass === "AdminYape2026") { 
        sessionStorage.setItem("admin_session", "active");
        window.location.href = "index.html"; // Redirección directa al index con panel abierto
      } else {
        document.getElementById("errorMessage").classList.remove("hidden");
      }
    }
  </script>
</body>
</html>

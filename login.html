<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yape - Ingresar Datos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            yape: "#7B2E83",
            yapeDark: "#5C1C6A",
            yapeBtn: "#8C3D99",
            yapeMint: "#10cbb4",
            yapeInk: "#3D3556"
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen flex flex-col items-center justify-center bg-[#5C1C6A] p-4 font-sans">

  <!-- Contenedor Principal estilo Teléfono/Yape -->
  <div class="w-full max-w-sm bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col justify-between min-h-[600px]">
    
    <!-- Encabezado morado de Yape -->
    <div class="bg-yape text-white px-5 py-6 text-center">
      <h1 class="font-bold text-xl tracking-wide">Yapear a un contacto</h1>
      <p class="text-xs text-purple-200 mt-1">Configura los datos para generar tu recibo</p>
    </div>

    <!-- Formulario Editable (Sin Contraseña) -->
    <div class="px-6 py-6 flex-grow space-y-4">
      <div>
        <label class="block text-xs font-bold text-yapeInk mb-1 uppercase tracking-wider">Nombre del Destinatario</label>
        <input id="loginNombre" type="text" placeholder="Ej. JUAN DE DIOS" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-yape/30 transition">
      </div>

      <div>
        <label class="block text-xs font-bold text-yapeInk mb-1 uppercase tracking-wider">Número de Celular</label>
        <input id="loginNumero" type="text" placeholder="Ej. 987 654 321" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-yape/30 transition">
      </div>

      <div>
        <label class="block text-xs font-bold text-yapeInk mb-1 uppercase tracking-wider">Monto (S/)</label>
        <input id="loginMonto" type="number" step="0.01" placeholder="0.00" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-yape/30 transition">
      </div>

      <div>
        <label class="block text-xs font-bold text-yapeInk mb-1 uppercase tracking-wider">Número de Operación</label>
        <input id="loginOperacion" type="text" placeholder="Ej. 25764402" class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-yape/30 transition">
      </div>
    </div>

    <!-- Botón de acción inferior -->
    <div class="p-6 bg-gray-50 border-t border-gray-100">
      <button onclick="generarYapeo()" class="w-full bg-yape hover:bg-yapeDark text-white py-4 rounded-xl font-bold text-base transition-all duration-200 shadow-md transform active:scale-95">
        Yapear 🚀
      </button>
    </div>

  </div>

  <script>
    // Generar un número de operación aleatorio por defecto por si el usuario no ingresa uno
    document.addEventListener("DOMContentLoaded", () => {
      const randomOp = Math.floor(10000000 + Math.random() * 90000000);
      document.getElementById("loginOperacion").placeholder = `Ej. ${randomOp}`;
    });

    function generarYapeo() {
      // 1. Capturar los campos del formulario
      const nombre = document.getElementById("loginNombre").value.trim() || "JUAN DE DIOS";
      const numero = document.getElementById("loginNumero").value.trim() || "*** *** 025";
      const monto = document.getElementById("loginMonto").value.trim() || "200.00";
      
      // Si la operación está vacía, genera la aleatoria que está de placeholder
      const operacionPlaceholder = document.getElementById("loginOperacion").placeholder.replace("Ej. ", "");
      const operacion = document.getElementById("loginOperacion").value.trim() || operacionPlaceholder;

      // 2. Guardar los datos de manera persistente en LocalStorage
      localStorage.setItem("yape_nombre", nombre);
      localStorage.setItem("yape_numero", numero);
      localStorage.setItem("yape_monto", parseFloat(monto).toFixed(2));
      localStorage.setItem("yape_operacion", operacion);

      // 3. ¡IMPORTANTE! Activar sesión para que la pantalla de confirmación no te bote al login.html
      sessionStorage.setItem("admin_session", "active");

      // 4. Redirigir a tu archivo principal del recibo (asumiendo que se llama index.html)
      window.location.href = "index.html"; 
    }
  </script>
</body>
</html>

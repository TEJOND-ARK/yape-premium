<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yape</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            yapeInk: '#2e0b3c',
            yapePurple: '#5C1C6A',
            yapeAqua: '#25D366',
            yapeGray: '#f4f4f4'
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #5C1C6A;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="flex flex-col justify-center items-center min-h-screen font-sans">

  <!-- 1. FORMULARIO DE INGRESO (Se oculta al yapear) -->
  <div id="seccionFormulario" class="bg-white rounded-3xl shadow-xl w-full max-w-md p-6 border border-gray-100 mx-4">
    <h2 class="text-xl font-bold text-yapeInk mb-4 text-center">Generar Yape Premium</h2>
    
    <div class="space-y-4">
      <!-- Input Nombre -->
      <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1">Nombre del Destinatario</label>
        <input id="inputNombre" type="text" placeholder="Ej. Juan Pérez" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-yapePurple">
      </div>

      <!-- Input Celular -->
      <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1">Número de Celular</label>
        <input id="inputCelular" type="tel" placeholder="Ej. 955 100 282" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-yapePurple">
      </div>

      <!-- Input Monto -->
      <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1">Monto (S/)</label>
        <input id="inputMonto" type="number" step="0.10" placeholder="Ej. 30.00" class="w-full px-4 py-3 border rounded-xl focus:outline-none focus:ring-2 focus:ring-yapePurple">
      </div>

      <!-- Botón para procesar -->
      <button id="btnYapear" class="w-full bg-yapePurple hover:bg-yapeInk text-white font-bold py-3.5 px-4 rounded-xl transition duration-200 shadow-md text-lg">
        Yapear
      </button>
    </div>
  </div>

  <!-- 2. VISTA DEL RECIBO COMPLETO (Formato Móvil Real) -->
  <div id="seccionRecibo" class="hidden w-full max-w-md min-h-screen bg-yapePurple flex flex-col justify-between text-white relative">
    
    <!-- Barra superior con la X de cerrar -->
    <div class="flex justify-between items-center px-6 pt-6 pb-2">
      <button id="btnCerrar" class="text-white hover:opacity-80">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
      <span class="text-sm font-medium tracking-wide">Compartir constancia</span>
    </div>

    <!-- Cuerpo del Recibo -->
    <div class="bg-white rounded-t-[32px] flex-1 flex flex-col justify-between p-6 text-center text-yapeInk shadow-2xl mt-2">
      
      <div>
        <!-- Check de Éxito -->
        <div class="flex justify-center mt-2 mb-3">
          <div class="bg-[#00D4AF] p-3 rounded-full">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" d="M5 13l4 4L19 7"></path>
            </svg>
          </div>
        </div>

        <!-- Título -->
        <h2 class="text-xl font-bold text-yapeInk mb-1">¡Yapeaste!</h2>

        <!-- SECCIÓN DE MONTO CON EL PERSONAJE HISTÓRICO DE FONDO -->
        <div class="relative flex justify-center items-center my-4 h-36">
          <!-- Personaje de Fondo Dinámico -->
          <img id="personajeFondo" src="10_soles-removebg-preview.png" alt="Personaje" class="absolute max-h-36 w-auto object-contain opacity-40 pointer-events-none select-none z-0">
          
          <!-- El Monto -->
          <div class="relative z-10 flex items-baseline">
            <span class="text-yapeInk text-3xl font-extrabold mr-1">S/</span>
            <span id="montoFinal" class="text-yapeInk text-6xl font-black tracking-tight">0.00</span>
          </div>
        </div>

        <!-- Nombre del Destinatario -->
        <p id="nombreDestinatario" class="text-xl font-extrabold text-yapeInk mb-1">Destinatario</p>
        
        <!-- Celular del Destinatario -->
        <p id="celularDestinatario" class="text-sm text-gray-500 font-semibold mb-4">• 955 100 282</p>

        <!-- Detalles de la Transacción -->
        <div class="bg-gray-50 rounded-2xl p-4 text-left space-y-2 border border-gray-100 max-w-sm mx-auto">
          <div class="flex justify-between text-xs">
            <span class="text-gray-400 font-semibold">Fecha y hora</span>
            <span id="fechaHora" class="text-gray-600 font-bold">13 Jul. 2026 - 17:27</span>
          </div>
          <div class="flex justify-between text-xs">
            <span class="text-gray-400 font-semibold">Destino</span>
            <span class="text-gray-600 font-bold">Yape</span>
          </div>
          <div class="flex justify-between text-xs">
            <span class="text-gray-400 font-semibold">N° de operación</span>
            <span id="numOperacion" class="text-gray-600 font-bold">98374283</span>
          </div>
        </div>
      </div>

      <!-- SECCIÓN PUBLICITARIA (URL COMPLETA .WEBP CORREGIDA) -->
      <div class="mt-6 mb-4">
        <div class="rounded-3xl overflow-hidden p-5 bg-[#4A1153] shadow-md">
          <div class="text-sm font-semibold text-white mb-3.5 flex justify-between items-center">
            <span>Más en Yape</span>
            <span class="text-black bg-yellow-400 px-1.5 py-0.5 text-[10px] rounded uppercase font-black">Nuevo</span>
          </div>
          <div class="rounded-2xl overflow-hidden">
            <!-- Cargando tu imagen favorita de manera segura -->
            <img src="https://i.postimg.cc/W3DvJwTz/6.webp" alt="Publicidad Yape" class="w-full h-auto object-cover">
          </div>
        </div>
      </div>

      <!-- Botón de Cierre "Ir a inicio" -->
      <button id="btnIrInicio" class="w-full bg-[#f4f4f4] hover:bg-gray-200 text-yapePurple font-extrabold py-3.5 px-4 rounded-xl transition duration-200 text-sm tracking-wide">
        Ir a inicio
      </button>

    </div>
  </div>

  <!-- LÓGICA DE CONTROL LOCAL -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      
      const btnYapear = document.getElementById("btnYapear");
      const btnCerrar = document.getElementById("btnCerrar");
      const btnIrInicio = document.getElementById("btnIrInicio");

      if (btnYapear) {
        btnYapear.addEventListener("click", () => {
          const inputMontoVal = document.getElementById("inputMonto").value;
          const inputMonto = parseFloat(inputMontoVal) || 0;
          const inputNombre = document.getElementById("inputNombre").value;
          const inputCelular = document.getElementById("inputCelular").value;

          const txtMontoFinal = document.getElementById("montoFinal");
          const txtNombreDestinatario = document.getElementById("nombreDestinatario");
          const txtCelularDestinatario = document.getElementById("celularDestinatario");
          const txtFechaHora = document.getElementById("fechaHora");
          const txtNumOperacion = document.getElementById("numOperacion");
          const imgPersonaje = document.getElementById("personajeFondo");

          // 1. Mostrar Monto formateado con decimales
          txtMontoFinal.textContent = inputMonto.toFixed(2);

          // 2. Lógica Dinámica de Personajes Históricos según el Rango de Monto
          if (inputMonto >= 0.1 && inputMonto <= 19.99) {
            imgPersonaje.src = "10_soles-removebg-preview.png"; // José Quiñones
          } else if (inputMonto >= 20.00 && inputMonto <= 49.99) {
            imgPersonaje.src = "20_soles-removebg-preview.png"; // Miguel Grau
          } else if (inputMonto >= 50.00 && inputMonto <= 99.99) {
            imgPersonaje.src = "50_soles-removebg-preview.png"; // Abraham Valdelomar
          } else if (inputMonto >= 100.00 && inputMonto <= 199.99) {
            imgPersonaje.src = "100_soles-removebg-preview.png"; // Pedro Paulet
          } else if (inputMonto >= 200.00) {
            imgPersonaje.src = "200_soles-removebg-preview.png"; // Santa Rosa de Lima
          } else {
            imgPersonaje.src = "10_soles-removebg-preview.png"; // Default
          }

          // 3. Pintar Datos del Destinatario
          txtNombreDestinatario.textContent = inputNombre.trim() !== "" ? inputNombre : "Destinatario";
          txtCelularDestinatario.textContent = inputCelular.trim() !== "" ? `• ${inputCelular}` : "• 955 100 282";

          // 4. Generar Fecha y Hora Actual automáticamente
          const ahora = new Date();
          const meses = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Set", "Oct", "Nov", "Dic"];
          const dia = ahora.getDate();
          const mes = meses[ahora.getMonth()];
          const anio = ahora.getFullYear();
          const hora = String(ahora.getHours()).padStart(2, '0');
          const minutos = String(ahora.getMinutes()).padStart(2, '0');
          txtFechaHora.textContent = `${dia} ${mes}. ${anio} - ${hora}:${minutos}`;

          // 5. Generar Número de Operación de 8 dígitos al azar
          const numOpAzar = Math.floor(10000000 + Math.random() * 90000000);
          txtNumOperacion.textContent = numOpAzar;

          // 6. Cambiar Pantalla (Ocultar Formulario, Mostrar Recibo)
          document.getElementById("seccionFormulario").classList.add("hidden");
          document.getElementById("seccionRecibo").classList.remove("hidden");
        });
      }

      // Función para resetear los valores y volver al formulario
      const regresarAlFormulario = () => {
        document.getElementById("inputMonto").value = "";
        document.getElementById("inputNombre").value = "";
        document.getElementById("inputCelular").value = "";
        document.getElementById("seccionRecibo").classList.add("hidden");
        document.getElementById("seccionFormulario").classList.remove("hidden");
      };

      if (btnCerrar) btnCerrar.addEventListener("click", regresarAlFormulario);
      if (btnIrInicio) btnIrInicio.addEventListener("click", regresarAlFormulario);

    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yapear - Confirmación</title>
  
  <!-- Importación de Google Fonts: Inter para la tipografía limpia de Yape -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            yapeDeepPurple: '#2B133D',
            yapeBackground: '#741880',
            yapeMagenta: '#8E288F',
            yapeTextGray: '#61546B',
            yapeLightBg: '#F4EFF6',
            yapeAqua: '#00D4AF',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #741880;
      -webkit-tap-highlight-color: transparent;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="flex flex-col items-center h-screen bg-[#741880] overflow-hidden">

  <!-- 1. FORMULARIO DE INGRESO (Oculto si ya hay datos del QR) -->
  <div id="seccionFormulario" class="hidden bg-white rounded-3xl shadow-xl w-[92%] max-w-sm p-6 border border-gray-100 my-auto z-20">
    <h2 class="text-xl font-medium text-yapeDeepPurple mb-4 text-center">Generar Yape</h2>
    
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Nombre del Destinatario</label>
        <input id="inputNombre" type="text" placeholder="Ej. Melanie Hua*" class="w-full px-4 py-2.5 border rounded-xl focus:outline-none focus:ring-2 focus:ring-yapeBackground text-yapeDeepPurple">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Número de Celular</label>
        <input id="inputCelular" type="text" placeholder="Ej. 987654074" class="w-full px-4 py-2.5 border rounded-xl focus:outline-none focus:ring-2 focus:ring-yapeBackground text-yapeDeepPurple">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-600 mb-1">Monto (S/)</label>
        <input id="inputMonto" type="number" step="0.1" placeholder="Ej. 20" class="w-full px-4 py-2.5 border rounded-xl focus:outline-none focus:ring-2 focus:ring-yapeBackground text-yapeDeepPurple">
      </div>
      <button id="btnYapear" class="w-full bg-[#741880] hover:bg-opacity-90 text-white font-medium py-3 px-4 rounded-xl transition duration-200 shadow-md">
        Yapear
      </button>
    </div>
  </div>

  <!-- 2. VISTA DEL RECIBO COMPLETO (Ajustado para ocupar el alto real y cortar la publicidad abajo) -->
  <div id="seccionRecibo" class="hidden w-full max-w-[450px] flex flex-col items-center h-full pt-1 pb-0 px-3 overflow-hidden justify-between">
    
    <!-- Bloque Superior Móvil (Personaje + Tarjeta Blanca + Botones) -->
    <div class="w-full flex flex-col items-center flex-shrink-0">
      
      <!-- Contenedor del Personaje Superior -->
      <div class="relative w-full flex justify-center items-center">
        <img id="personajeFondo" src="20_soles-removebg-preview.png" alt="Personaje" class="w-full h-auto object-cover scale-105">
        <button id="btnCerrarX" class="absolute top-3 right-4 text-white/90 hover:text-white bg-white/10 rounded-full p-2 z-10">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <!-- Tarjeta Principal Blanca -->
      <div class="bg-white rounded-[24px] px-5 py-5 shadow-xl text-yapeDeepPurple w-[95%] relative overflow-hidden -mt-6 z-10">
        
        <div class="flex justify-between items-center mb-1.5">
          <h2 class="text-[21px] font-medium text-yapeMagenta tracking-tight">¡Yapeaste!</h2>
          <button class="text-[#00D4AF] font-medium text-sm flex items-center space-x-1">
            <svg class="w-3.5 h-3.5 text-[#00D4AF]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            <span class="text-[13.5px]">Compartir</span>
          </button>
        </div>

        <div class="flex items-baseline mb-0.5">
          <span class="text-yapeDeepPurple text-[28px] font-normal mr-1 select-none tracking-tight">S/</span>
          <span id="montoFinal" class="text-yapeDeepPurple text-[52px] font-normal tracking-tight leading-none">0.10</span>
        </div>

        <p id="nombreDestinatario" class="text-[19px] font-medium text-yapeDeepPurple mb-2 tracking-tight">Edward Ped*</p>

        <div class="flex items-center space-x-2 text-[12.5px] text-yapeTextGray font-normal mb-3 border-b border-gray-100 pb-2.5">
          <span class="flex items-center">
            <svg class="w-3.5 h-3.5 mr-1 text-yapeTextGray" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <span id="fechaTexto" class="font-normal">14 jul. 2026</span>
          </span>
          <span class="text-yapeTextGray font-light">|</span>
          <span class="flex items-center">
            <svg class="w-3.5 h-3.5 mr-1 text-yapeTextGray" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            <span id="horaTexto" class="font-normal">4:15 p. m.</span>
          </span>
        </div>

        <div class="flex items-center justify-between border-b border-gray-100 pb-3 mb-3">
          <span class="text-[10.5px] font-medium text-[#7A6D85] tracking-wider uppercase flex items-center">
            CÓDIGO DE SEGURIDAD 
            <span class="ml-1 bg-[#00D4AF] text-white rounded-full w-3.5 h-3.5 flex items-center justify-center text-[8px] font-semibold">i</span>
          </span>
          <div class="flex space-x-1.5">
            <span id="cod1" class="bg-yapeLightBg text-yapeDeepPurple font-bold text-[15px] w-8 h-7 flex items-center justify-center rounded-[4px] select-none">8</span>
            <span id="cod2" class="bg-yapeLightBg text-yapeDeepPurple font-bold text-[15px] w-8 h-7 flex items-center justify-center rounded-[4px] select-none">8</span>
            <span id="cod3" class="bg-yapeLightBg text-yapeDeepPurple font-bold text-[15px] w-8 h-7 flex items-center justify-center rounded-[4px] select-none">3</span>
          </div>
        </div>

        <div class="space-y-1.5">
          <p class="text-[10px] font-medium text-[#7A6D85] tracking-widest uppercase mb-1">Datos de la transacción</p>
          <div class="flex justify-between text-[13.5px]">
            <span class="text-yapeTextGray font-normal">Nro. de celular</span>
            <span id="celularDestinatario" class="text-yapeDeepPurple font-normal">*** *** 452</span>
          </div>
          <div class="flex justify-between text-[13.5px]">
            <span class="text-yapeTextGray font-normal">Destino</span>
            <span class="text-yapeDeepPurple font-normal">Yape</span>
          </div>
          <div class="flex justify-between text-[13.5px]">
            <span class="text-yapeTextGray font-normal">Nro. de operación</span>
            <span id="numOperacion" class="text-yapeDeepPurple font-normal">20961883</span>
          </div>
        </div>

      </div>

      <!-- Botón Nuevo Yapeo -->
      <button id="btnNuevoYapeo" class="w-[95%] bg-[#00D4AF] hover:bg-[#00bda0] text-white font-medium py-3.5 px-4 rounded-xl flex items-center justify-center space-x-2 text-[14.5px] shadow-sm transition duration-200 mt-4 z-10 flex-shrink-0">
        <svg width="18" height="18" class="transform -rotate-45 text-white flex-shrink-0" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
        </svg>
        <span>Nuevo Yapeo</span>
      </button>

      <!-- Botón Necesito Ayuda -->
      <button id="btnAyuda" class="w-[95%] text-white font-medium py-2.5 px-4 rounded-xl flex items-center justify-center space-x-2 text-[14px] hover:bg-white/5 z-10 mt-1 flex-shrink-0">
        <svg width="20" height="20" class="flex-shrink-0 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
          <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
        </svg>
        <span>Necesito ayuda</span>
      </button>
    </div>

    <!-- SECCIÓN PUBLICITARIA FLOTANTE (Anclada abajo y cortada naturalmente por la pantalla) -->
    <div class="rounded-t-3xl overflow-hidden p-4 bg-[#570B62] shadow-md w-[95%] mt-auto z-10 flex-shrink-0 mb-[-20px]">
      <div class="text-xs font-medium text-white mb-2 flex justify-between items-center">
        <span>Más en Yape</span>
        <span class="text-black bg-yellow-400 px-1.5 py-0.5 text-[9px] rounded uppercase font-medium">Nuevo</span>
      </div>
      <div class="rounded-xl overflow-hidden mb-4">
        <img src="https://i.postimg.cc/W3DvJwTz/6.webp" alt="Publicidad Yape" class="w-full h-auto object-cover">
      </div>
    </div>

  </div>

  <!-- LÓGICA DE CONTROL -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      
      const btnYapear = document.getElementById("btnYapear");
      const btnNuevoYapeo = document.getElementById("btnNuevoYapeo");
      const btnCerrarX = document.getElementById("btnCerrarX");

      function procesarYapeDirecto(nombreVal, celularVal, montoVal) {
        const inputMonto = parseFloat(montoVal) || 0.10;
        const inputNombre = nombreVal || "Edward Ped*";
        const inputCell = celularVal || "987654452";

        const txtMontoFinal = document.getElementById("montoFinal");
        const txtNombreDestinatario = document.getElementById("nombreDestinatario");
        const txtCelularDestinatario = document.getElementById("celularDestinatario");
        const txtFechaTexto = document.getElementById("fechaTexto");
        const txtHoraTexto = document.getElementById("horaTexto");
        const txtNumOperacion = document.getElementById("numOperacion");
        const imgPersonaje = document.getElementById("personajeFondo");

        const txtCod1 = document.getElementById("cod1");
        const txtCod2 = document.getElementById("cod2");
        const txtCod3 = document.getElementById("cod3");

        if (inputMonto % 1 === 0) {
          txtMontoFinal.textContent = inputMonto.toString();
        } else {
          txtMontoFinal.textContent = inputMonto.toFixed(2);
        }

        if (inputMonto >= 0.1 && inputMonto <= 19.99) {
          imgPersonaje.src = "10_soles-removebg-preview.png";
        } else if (inputMonto >= 20.00 && inputMonto <= 49.99) {
          imgPersonaje.src = "20_soles-removebg-preview.png";
        } else if (inputMonto >= 50.00 && inputMonto <= 99.99) {
          imgPersonaje.src = "50_soles-removebg-preview.png";
        } else if (inputMonto >= 100.00 && inputMonto <= 199.99) {
          imgPersonaje.src = "100_soles-removebg-preview.png";
        } else if (inputMonto >= 200.00) {
          imgPersonaje.src = "200_soles-removebg-preview.png";
        } else {
          imgPersonaje.src = "10_soles-removebg-preview.png";
        }

        txtNombreDestinatario.textContent = inputNombre.trim() !== "" ? inputNombre : "Edward Ped*";

        const celularLimpio = inputCell.replace(/\D/g, ''); 
        if (celularLimpio.length >= 3) {
          const ultimosTres = celularLimpio.substring(celularLimpio.length - 3);
          txtCelularDestinatario.textContent = `*** *** ${ultimosTres}`;
        } else if (inputCell.trim() !== "") {
          txtCelularDestinatario.textContent = inputCell;
        } else {
          txtCelularDestinatario.textContent = "*** *** 452";
        }

        const ahora = new Date();
        const meses = ["ene.", "feb.", "mar.", "abr.", "may.", "jun.", "jul.", "ago.", "set.", "oct.", "nov.", "dic."];
        const dia = ahora.getDate();
        const mes = meses[ahora.getMonth()];
        const anio = ahora.getFullYear();
        
        let horas = ahora.getHours();
        const minutos = String(ahora.getMinutes()).padStart(2, '0');
        const ampm = horas >= 12 ? 'p. m.' : 'a. m.';
        horas = horas % 12;
        const textHora = horas ? horas : 12;

        txtFechaTexto.textContent = `${dia} ${mes}. ${anio}`;
        txtHoraTexto.textContent = `${textHora}:${minutos} ${ampm}`;

        const numOpAzar = String(Math.floor(10000000 + Math.random() * 90000000)).padStart(8, '0');
        txtNumOperacion.textContent = "20" + numOpAzar.substring(2);

        txtCod1.textContent = Math.floor(Math.random() * 10);
        txtCod2.textContent = Math.floor(Math.random() * 10);
        txtCod3.textContent = Math.floor(Math.random() * 10);

        document.getElementById("seccionFormulario").classList.add("hidden");
        document.getElementById("seccionRecibo").classList.remove("hidden");
      }

      const localNombre = localStorage.getItem("yape_nombre");
      const localNumero = localStorage.getItem("yape_numero");
      const localMonto = localStorage.getItem("yape_monto");

      if (localNombre && localMonto) {
        procesarYapeDirecto(localNombre, localNumero, localMonto);
      } else {
        document.getElementById("seccionFormulario").classList.remove("hidden");
      }

      if (btnYapear) {
        btnYapear.addEventListener("click", () => {
          const nom = document.getElementById("inputNombre").value;
          const cel = document.getElementById("inputCelular").value;
          const mon = document.getElementById("inputMonto").value;
          procesarYapeDirecto(nom, cel, mon);
        });
      }

      const regresarAlFormulario = () => {
        localStorage.removeItem("yape_nombre");
        localStorage.removeItem("yape_numero");
        localStorage.removeItem("yape_monto");
        window.location.href = "index.html"; 
      };

      if (btnNuevoYapeo) btnNuevoYapeo.addEventListener("click", regresarAlFormulario);
      if (btnCerrarX) btnCerrarX.addEventListener("click", regresarAlFormulario);

    });
  </script>
</body>
</html>

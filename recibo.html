<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yapear - Confirmación</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            yapeInk: '#2B1A3B',       /* Color ciruela muy oscuro */
            yapePurple: '#740B83',    /* Morado eléctrico oficial de Yape */
            yapeMagenta: '#8F1D95',   /* Fucsia de ¡Yapeaste! */
            yapeGray: '#71657A',      /* Gris suave */
            yapeAqua: '#00D4AF',      /* Turquesa del botón */
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #740B83;      /* Morado eléctrico exacto de fondo */
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="flex flex-col items-center min-h-screen bg-[#740B83] overflow-x-hidden">

  <!-- 1. FORMULARIO DE INGRESO (Se mantiene oculto por defecto ahora) -->
  <div id="seccionFormulario" class="hidden bg-white rounded-3xl shadow-xl w-[92%] max-w-sm p-6 border border-gray-100 my-auto z-20">
    <h2 class="text-xl font-bold text-yapeInk mb-4 text-center">Generar Yape</h2>
    
    <div class="space-y-4">
      <!-- Input Nombre -->
      <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1">Nombre del Destinatario</label>
        <input id="inputNombre" type="text" placeholder="Ej. Melanie Hua*" class="w-full px-4 py-2.5 border rounded-xl focus:outline-none focus:ring-2 focus:ring-yapePurple text-yapeInk">
      </div>

      <!-- Input Celular -->
      <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1">Número de Celular</label>
        <input id="inputCelular" type="text" placeholder="Ej. 987654074" class="w-full px-4 py-2.5 border rounded-xl focus:outline-none focus:ring-2 focus:ring-yapePurple text-yapeInk">
      </div>

      <!-- Input Monto -->
      <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1">Monto (S/)</label>
        <input id="inputMonto" type="number" step="0.1" placeholder="Ej. 20" class="w-full px-4 py-2.5 border rounded-xl focus:outline-none focus:ring-2 focus:ring-yapePurple text-yapeInk">
      </div>

      <!-- Botón para procesar manualmente si se desea -->
      <button id="btnYapear" class="w-full bg-[#740B83] hover:bg-opacity-90 text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-md">
        Yapear
      </button>
    </div>
  </div>

  <!-- 2. VISTA DEL RECIBO COMPLETO (Se muestra directamente al cargar si hay datos) -->
  <div id="seccionRecibo" class="hidden w-full max-w-[420px] flex flex-col items-center space-y-2 px-3 pt-1 pb-1">
    
    <!-- Contenedor del Personaje Superior -->
    <div class="relative w-full flex justify-center items-center">
      <img id="personajeFondo" src="20_soles-removebg-preview.png" alt="Personaje Histórico" class="w-full h-auto object-cover scale-105">
      <!-- Botón X original -->
      <button id="btnCerrarX" class="absolute top-3 right-4 text-white/90 hover:text-white bg-white/10 rounded-full p-2 z-10">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <!-- Tarjeta Principal Blanca -->
    <div class="bg-white rounded-[24px] px-5 py-4 shadow-xl text-yapeInk w-[98%] relative overflow-hidden -mt-6 z-10">
      
      <!-- Encabezado ¡Yapeaste! y Compartir -->
      <div class="flex justify-between items-center mb-1">
        <h2 class="text-[22px] font-semibold text-yapeMagenta tracking-tight">¡Yapeaste!</h2>
        <button class="text-[#00D4AF] font-extrabold text-sm flex items-center space-x-1">
          <svg class="w-3.5 h-3.5 text-[#00D4AF]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
          <span class="text-[13.5px]">Compartir</span>
        </button>
      </div>

      <!-- Sección del Monto -->
      <div class="flex items-baseline mb-0.5">
        <span class="text-yapeInk text-[28px] font-bold mr-1 select-none tracking-tight">S/</span>
        <span id="montoFinal" class="text-yapeInk text-[52px] font-bold tracking-tighter leading-none">20</span>
      </div>

      <!-- Nombre del Destinatario -->
      <p id="nombreDestinatario" class="text-[19px] font-semibold text-yapeInk mb-2 tracking-tight">Melanie Hua*</p>

      <!-- Fecha y Hora -->
      <div class="flex items-center space-x-2 text-[12px] text-yapeGray font-semibold mb-2.5 border-b border-gray-100 pb-2.5">
        <span class="flex items-center">
          <svg class="w-3.5 h-3.5 mr-1 text-yapeGray" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          <span id="fechaTexto">13 jul. 2026</span>
        </span>
        <span class="text-yapeGray font-normal">|</span>
        <span class="flex items-center">
          <svg class="w-3.5 h-3.5 mr-1 text-yapeGray" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span id="horaTexto">08:54 a. m.</span>
        </span>
      </div>

      <!-- Código de Seguridad -->
      <div class="flex items-center justify-between border-b border-gray-100 pb-2.5 mb-2.5">
        <span class="text-[10px] font-extrabold text-yapeGray tracking-wider uppercase flex items-center">
          CÓDIGO DE SEGURIDAD 
          <span class="ml-1 bg-[#00D4AF] text-white rounded-full w-3.5 h-3.5 flex items-center justify-center text-[8px] font-black">i</span>
        </span>
        <div class="flex space-x-1.5">
          <span id="cod1" class="bg-[#F4F2F5] text-yapeInk font-black text-[15px] w-8 h-7 flex items-center justify-center rounded-md select-none">1</span>
          <span id="cod2" class="bg-[#F4F2F5] text-yapeInk font-black text-[15px] w-8 h-7 flex items-center justify-center rounded-md select-none">6</span>
          <span id="cod3" class="bg-[#F4F2F5] text-yapeInk font-black text-[15px] w-8 h-7 flex items-center justify-center rounded-md select-none">6</span>
        </div>
      </div>

      <!-- Datos de la transacción -->
      <div class="space-y-1.5">
        <p class="text-[10.5px] font-extrabold text-[#71657A] tracking-wider uppercase mb-0.5">Datos de la transacción</p>
        
        <div class="flex justify-between text-[13.5px]">
          <span class="text-[#2B1A3B] font-semibold">Nro. de celular</span>
          <span id="celularDestinatario" class="text-black font-semibold">*** *** 074</span>
        </div>
        <div class="flex justify-between text-[13.5px]">
          <span class="text-[#2B1A3B] font-semibold">Destino</span>
          <span class="text-black font-semibold">Yape</span>
        </div>
        <div class="flex justify-between text-[13.5px]">
          <span class="text-[#2B1A3B] font-semibold">Nro. de operación</span>
          <span id="numOperacion" class="text-black font-semibold">09200409</span>
        </div>
      </div>

    </div>

    <!-- Botón de Acción -->
    <button id="btnNuevoYapeo" class="w-[98%] bg-[#00D4AF] hover:bg-[#00bda0] text-white font-extrabold py-3.5 px-4 rounded-xl flex items-center justify-center space-x-2 text-[14.5px] shadow-sm transition duration-200 mt-1 z-10">
      <svg width="18" height="18" class="transform -rotate-45 text-white flex-shrink-0" viewBox="0 0 24 24" fill="currentColor">
        <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
      </svg>
      <span>Nuevo Yapeo</span>
    </button>

    <!-- Botón de Necesito Ayuda -->
    <button id="btnAyuda" class="w-[98%] text-white font-bold py-2 px-4 rounded-xl flex items-center justify-center space-x-2 text-[14px] hover:bg-white/5 z-10">
      <svg width="20" height="20" class="flex-shrink-0 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"></path>
      </svg>
      <span>Necesito ayuda</span>
    </button>

    <!-- SECCIÓN PUBLICITARIA FLOTANTE -->
    <div class="rounded-t-3xl overflow-hidden p-4 bg-[#590463] shadow-md w-[98%] mt-1 z-10">
      <div class="text-xs font-bold text-white mb-2 flex justify-between items-center">
        <span>Más en Yape</span>
        <span class="text-black bg-yellow-400 px-1.5 py-0.5 text-[9px] rounded uppercase font-black">Nuevo</span>
      </div>
      <div class="rounded-xl overflow-hidden">
        <img src="https://i.postimg.cc/W3DvJwTz/6.webp" alt="Publicidad Yape" class="w-full h-auto object-cover">
      </div>
    </div>

  </div>

  <!-- LÓGICA DE CONTROL -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      
      const btnYapear = document.getElementById("btnYapear");
      const btnNuevoYapeo = document.getElementById("btnNuevoYapeo");
      const btnCerrarX = document.getElementById("btnCerrarX");

      // FUNCIÓN CLAVE: Procesa y muestra los datos directamente
      function procesarYapeDirecto(nombreVal, celularVal, montoVal) {
        const inputMonto = parseFloat(montoVal) || 20;
        const inputNombre = nombreVal || "Melanie Hua*";
        const inputCell = celularVal || "987654074";

        const txtMontoFinal = document.getElementById("montoFinal");
        const txtNombreDestinatario = document.getElementById("nombreDestinatario");
        const txtCelularDestinatario = document.getElementById("celularDestinatario");
        const txtFechaTexto = document.getElementById("fechaTexto");
        const txtHoraTexto = document.getElementById("horaTexto");
        const txtNumOperacion = document.getElementById("numOperacion");
        const imgPersonaje = document.getElementById("personajeFondo");

        const txtCod1 = document.getElementById("cod1");
        const txtCod2 = document.getElementById("cod2");
        const txtCod3 = document.getElementById("cod3");

        // 1. Mostrar Monto sin decimales si es entero
        if (inputMonto % 1 === 0) {
          txtMontoFinal.textContent = inputMonto.toString();
        } else {
          txtMontoFinal.textContent = inputMonto.toFixed(2);
        }

        // 2. Lógica Dinámica de Personajes según el Monto
        if (inputMonto >= 0.1 && inputMonto <= 19.99) {
          imgPersonaje.src = "10_soles-removebg-preview.png";
        } else if (inputMonto >= 20.00 && inputMonto <= 49.99) {
          imgPersonaje.src = "20_soles-removebg-preview.png";
        } else if (inputMonto >= 50.00 && inputMonto <= 99.99) {
          imgPersonaje.src = "50_soles-removebg-preview.png";
        } else if (inputMonto >= 100.00 && inputMonto <= 199.99) {
          imgPersonaje.src = "100_soles-removebg-preview.png";
        } else if (inputMonto >= 200.00) {
          imgPersonaje.src = "200_soles-removebg-preview.png";
        } else {
          imgPersonaje.src = "10_soles-removebg-preview.png";
        }

        // 3. Pintar Datos del Destinatario
        txtNombreDestinatario.textContent = inputNombre.trim() !== "" ? inputNombre : "Melanie Hua*";

        // Formateador dinámico para el celular (pasa "987654074" a "*** *** 074")
        const celularLimpio = inputCell.replace(/\D/g, ''); // Solo números
        if (celularLimpio.length >= 3) {
          const ultimosTres = celularLimpio.substring(celularLimpio.length - 3);
          txtCelularDestinatario.textContent = `*** *** ${ultimosTres}`;
        } else if (inputCell.trim() !== "") {
          txtCelularDestinatario.textContent = inputCell;
        } else {
          txtCelularDestinatario.textContent = "*** *** 074";
        }

        // 4. Generar Fecha y Hora Actual
        const ahora = new Date();
        const meses = ["ene.", "feb.", "mar.", "abr.", "may.", "jun.", "jul.", "ago.", "set.", "oct.", "nov.", "dic."];
        const dia = ahora.getDate();
        const mes = meses[ahora.getMonth()];
        const anio = ahora.getFullYear();
        
        let horas = ahora.getHours();
        const minutos = String(ahora.getMinutes()).padStart(2, '0');
        const ampm = horas >= 12 ? 'p. m.' : 'a. m.';
        horas = horas % 12;
        textHora = horas ? horas : 12;
        const horasFormateadas = String(textHora).padStart(2, '0');

        txtFechaTexto.textContent = `${dia} ${mes} ${anio}`;
        txtHoraTexto.textContent = `${horasFormateadas}:${minutos} ${ampm}`;

        // 5. Generar Número de Operación de 8 dígitos
        const numOpAzar = String(Math.floor(10000000 + Math.random() * 90000000)).padStart(8, '0');
        txtNumOperacion.textContent = "0" + numOpAzar;

        // 6. Códigos de seguridad aleatorios
        txtCod1.textContent = Math.floor(Math.random() * 10);
        txtCod2.textContent = Math.floor(Math.random() * 10);
        txtCod3.textContent = Math.floor(Math.random() * 10);

        // 7. Mostrar Pantalla de Recibo
        document.getElementById("seccionFormulario").classList.add("hidden");
        document.getElementById("seccionRecibo").classList.remove("hidden");
      }

      // NUEVO: Auto-ejecución leyendo del LocalStorage
      const localNombre = localStorage.getItem("yape_nombre");
      const localNumero = localStorage.getItem("yape_numero");
      const localMonto = localStorage.getItem("yape_monto");

      if (localNombre && localMonto) {
        // Si hay datos listos de la primera pantalla, renderizamos el recibo directamente
        procesarYapeDirecto(localNombre, localNumero, localMonto);
      } else {
        // Si no hay datos (entraste de la nada), mostramos el formulario manual
        document.getElementById("seccionFormulario").classList.remove("hidden");
      }

      // Procesador manual alternativo (por si se usa el formulario interno)
      if (btnYapear) {
        btnYapear.addEventListener("click", () => {
          const inputNombre = document.getElementById("inputNombre").value;
          const inputCelular = document.getElementById("inputCelular").value;
          const inputMontoVal = document.getElementById("inputMonto").value;
          procesarYapeDirecto(inputNombre, inputCelular, inputMontoVal);
        });
      }

      const regresarAlFormulario = () => {
        // Limpiamos los datos guardados para que la próxima vez pida configurarse de cero
        localStorage.removeItem("yape_nombre");
        localStorage.removeItem("yape_numero");
        localStorage.removeItem("yape_monto");
        
        window.location.href = "index.html"; // Regresa al menú morado de configuración
      };

      if (btnNuevoYapeo) btnNuevoYapeo.addEventListener("click", regresarAlFormulario);
      if (btnCerrarX) btnCerrarX.addEventListener("click", regresarAlFormulario);

    });
  </script>
</body>
</html>

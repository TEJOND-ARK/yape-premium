<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yapear - Confirmación</title>
  <!-- Iconos Lucide elegantes y limpios -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // CONTROL DE ACCESO
    if (sessionStorage.getItem("admin_session") !== "active") {
      window.location.href = "index.html";
    }

    tailwind.config = {
      theme: {
        extend: {
          colors: {
            yapeBg: "#5C1C6A",
            yapeTxt: "#3D3556",
            yapePurple: "#7B2E83",
            yapeMint: "#10cbb4",
            yapeMintDark: "#0eb39e",
            yapeGray: "#F3F4F6"
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-yapeBg font-sans select-none overflow-y-auto scroll-smooth flex flex-col items-center justify-start pb-12">

  <!-- CONTENEDOR PRINCIPAL CON SCROLL LIBRE -->
  <div class="w-full max-w-sm px-5 pt-3 flex flex-col">
    
    <!-- SECCIÓN BILLETE + BOTÓN X -->
    <div class="relative w-full rounded-3xl overflow-hidden mb-4 shadow-md">
      <img id="bannerHistorial" src="" alt="Billete Histórico" class="w-full h-auto object-contain">
      
      <!-- Botón X de cerrar original -->
      <button onclick="volverAlEditor()" class="absolute top-4 right-4 bg-black/30 text-white rounded-full p-2 hover:bg-black/40 transition flex items-center justify-center">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- TARJETA BLANCA DEL RECIBO -->
    <div class="bg-white rounded-3xl p-6 shadow-xl mb-4">
      
      <!-- Fila: ¡Yapeaste! + Compartir -->
      <div class="flex justify-between items-center mb-5">
        <h1 class="text-yapePurple font-bold text-2xl tracking-tight">¡Yapeaste!</h1>
        <button onclick="volverAlEditor()" class="text-yapeMint hover:text-yapeMintDark font-semibold flex items-center gap-1.5 text-base">
          <i data-lucide="share-2" class="w-4.5 h-4.5"></i> Compartir
        </button>
      </div>

      <!-- Fila: S/ Monto -->
      <div class="flex items-baseline mb-4 text-yapeTxt">
        <span class="text-3xl font-bold mr-2">S/</span>
        <span id="montoFinal" class="text-5.5xl font-normal tracking-tight leading-none">0</span>
      </div>

      <!-- Nombre con asterisco automático -->
      <p id="nombreDestino" class="text-yapeTxt text-[21px] font-bold mb-3"></p>

      <!-- Fecha y Hora con Iconos -->
      <div class="flex items-center gap-1.5 text-gray-500 font-medium text-sm mb-5">
        <i data-lucide="calendar" class="w-4 h-4"></i>
        <span id="fechaActual">-- ---. ----</span>
        <span class="text-gray-300 mx-0.5">|</span>
        <i data-lucide="clock" class="w-4 h-4"></i>
        <span id="horaActual">--:-- --. --.</span>
      </div>

      <!-- CÓDIGO DE SEGURIDAD INTERMITENTE -->
      <div class="border-t border-b border-gray-100 py-4 flex justify-between items-center mb-5">
        <div class="flex items-center gap-1.5">
          <span class="text-xs font-bold text-gray-400 tracking-wider">CÓDIGO DE SEGURIDAD</span>
          <div class="bg-yapeMint text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px] font-bold">i</div>
        </div>
        <div class="flex gap-1.5">
          <span class="bg-gray-100 text-yapeTxt font-bold px-3 py-1 rounded-md text-sm shadow-sm" id="cod1">1</span>
          <span class="bg-gray-100 text-yapeTxt font-bold px-3 py-1 rounded-md text-sm shadow-sm" id="cod2">6</span>
          <span class="bg-gray-100 text-yapeTxt font-bold px-3 py-1 rounded-md text-sm shadow-sm" id="cod3">6</span>
        </div>
      </div>

      <!-- DETALLE DE TRANSACCIÓN -->
      <p class="text-[11px] font-bold text-gray-400 tracking-widest mb-4">DATOS DE LA TRANSACCIÓN</p>

      <div class="space-y-3.5 text-[15px] text-yapeTxt">
        <div class="flex justify-between">
          <span class="font-normal text-gray-500">Nro. de celular</span>
          <span class="font-bold tracking-wide" id="numeroDestino">*** *** 008</span>
        </div>
        <div class="flex justify-between">
          <span class="font-normal text-gray-500">Destino</span>
          <span class="font-bold">Yape</span>
        </div>
        <div class="flex justify-between">
          <span class="font-normal text-gray-500">Nro. de operación</span>
          <span class="font-bold tracking-wide" id="numeroOperacion">19961166</span>
        </div>
      </div>

    </div>

    <!-- BOTONES DE ACCIÓN (Estilo nativo extendido) -->
    <div class="space-y-3 mb-6">
      <button onclick="volverAlEditor()" class="w-full bg-yapeMint hover:bg-yapeMintDark text-yapeTxt py-4 rounded-2xl font-bold text-base transition flex items-center justify-center gap-2 shadow-md">
        <i data-lucide="send" class="w-5 h-5"></i> Nuevo Yapeo
      </button>
      
      <button onclick="volverAlEditor()" class="w-full bg-transparent text-white py-3 rounded-2xl font-bold text-sm transition flex items-center justify-center gap-2 hover:bg-white/5">
        <i data-lucide="headphones" class="w-5 h-5"></i> Necesito ayuda
      </button>
    </div>

    <!-- SECCIÓN PUBLICITARIA FLOTANTE (Al final del scroll) -->
    <div class="rounded-3xl overflow-hidden p-5 bg-[#4A1153] shadow-md">
      <div class="text-sm font-semibold text-white mb-3.5 flex justify-between items-center">
        <span>Más en Yape</span>
        <span class="text-black rounded-md px-2 py-0.5 text-[11px] bg-[#f5c035] font-bold">Nuevo</span>
      </div>
      <div class="rounded-2xl overflow-hidden">
        <img src="https://i.postimg.cc/W3DvJwTz/6.webp" alt="Publicidad Yape" class="w-full h-auto object-cover">
      </div>
    </div>

  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      cargarDatos();
      lucide.createIcons(); // Carga todos los iconos vectorizados
    });

    function cargarDatos() {
      const montoRaw = parseFloat(localStorage.getItem("yape_monto") || "1.00");
      const nombre = localStorage.getItem("yape_nombre") || "Daniel Dav";
      const numero = localStorage.getItem("yape_numero") || "*** *** 008";
      const operacion = localStorage.getItem("yape_operacion") || "19961166";
      const fecha = localStorage.getItem("yape_fecha") || "13 jul. 2026";
      const hora = localStorage.getItem("yape_hora") || "03:15 p. m.";

      // Formatear monto nativo (quitar decimales .00 si es entero)
      if (montoRaw % 1 === 0) {
        document.getElementById("montoFinal").textContent = parseInt(montoRaw);
      } else {
        document.getElementById("montoFinal").textContent = montoRaw.toFixed(2);
      }

      // Añadir automáticamente asterisco al nombre si no lo trae
      if (!nombre.endsWith('*')) {
        document.getElementById("nombreDestino").textContent = nombre + "*";
      } else {
        document.getElementById("nombreDestino").textContent = nombre;
      }

      document.getElementById("numeroDestino").textContent = numero;
      document.getElementById("numeroOperacion").textContent = operacion;
      document.getElementById("fechaActual").textContent = fecha;
      document.getElementById("horaActual").textContent = hora;

      // Generar código de seguridad dinámico basado en los últimos 3 números de operación
      const ultimosTres = operacion.slice(-3);
      document.getElementById("cod1").textContent = ultimosTres[0] || "1";
      document.getElementById("cod2").textContent = ultimosTres[1] || "6";
      document.getElementById("cod3").textContent = ultimosTres[2] || "6";

      asignarBannerPersonaje(montoRaw);
    }

    function asignarBannerPersonaje(monto) {
      const imgElement = document.getElementById("bannerHistorial");
      
      if (monto >= 0.1 && monto <= 19.99) {
        imgElement.src = "./10_soles-removebg-preview.png";
      } else if (monto >= 20.00 && monto <= 49.99) {
        imgElement.src = "./20_soles-removebg-preview.png";
      } else if (monto >= 50.00 && monto <= 99.99) {
        imgElement.src = "./50_soles-removebg-preview.png";
      } else if (monto >= 100.00 && monto <= 199.99) {
        imgElement.src = "./100_soles-removebg-preview.png";
      } else if (monto >= 200.00 && monto <= 1000.00) {
        imgElement.src = "./200_soles-removebg-preview.png";
      } else {
        imgElement.src = "./200_soles-removebg-preview.png";
      }
    }

    function volverAlEditor() {
      window.location.href = "index.html"; 
    }
  </script>
</body>
</html>

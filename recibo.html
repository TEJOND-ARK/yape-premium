<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yapear - Confirmación</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            yapeInk: '#311443',       /* Morado ultra oscuro original para montos y nombres */
            yapePurple: '#5C1C6A',    /* Fondo morado de la app */
            yapeMagenta: '#932399',   /* Fucsia brillante de ¡Yapeaste! */
            yapeGray: '#8c7d95',      /* Gris morado de las etiquetas y textos secundarios */
            yapeAqua: '#00D4AF',      /* Turquesa de los botones e iconos */
            yapeTeal: '#00d4af'
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #5C1C6A;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="flex flex-col items-center min-h-screen font-sans bg-[#5C1C6A]">

  <!-- 1. FORMULARIO DE INGRESO (Se oculta al yapear) -->
  <div id="seccionFormulario" class="bg-white rounded-3xl shadow-xl w-[90%] max-w-sm p-6 border border-gray-100 my-auto">
    <h2 class="text-xl font-bold text-yapeInk mb-4 text-center">Generar Yape</h2>
    
    <div class="space-y-4">
      <!-- Input Nombre -->
      <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1">Nombre del Destinatario</label>
        <input id="inputNombre" type="text" placeholder="Ej. Daniel Dav*" class="w-full px-4 py-2.5 border rounded-xl focus:outline-none focus:ring-2 focus:ring-yapePurple text-yapeInk">
      </div>

      <!-- Input Celular -->
      <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1">Número de Celular</label>
        <input id="inputCelular" type="text" placeholder="Ej. *** *** 074" class="w-full px-4 py-2.5 border rounded-xl focus:outline-none focus:ring-2 focus:ring-yapePurple text-yapeInk">
      </div>

      <!-- Input Monto -->
      <div>
        <label class="block text-sm font-semibold text-gray-600 mb-1">Monto (S/)</label>
        <input id="inputMonto" type="number" step="0.1" placeholder="Ej. 20" class="w-full px-4 py-2.5 border rounded-xl focus:outline-none focus:ring-2 focus:ring-yapePurple text-yapeInk">
      </div>

      <!-- Botón para procesar -->
      <button id="btnYapear" class="w-full bg-yapePurple hover:bg-yapeInk text-white font-bold py-3 px-4 rounded-xl transition duration-200 shadow-md">
        Yapear
      </button>
    </div>
  </div>

  <!-- 2. VISTA DEL RECIBO COMPLETO -->
  <div id="seccionRecibo" class="hidden w-full max-w-md flex flex-col items-center space-y-4 px-4 pt-4 pb-6">
    
    <!-- Contenedor del Personaje Superior (Ajustado) -->
    <div class="relative w-full flex justify-center items-center">
      <img id="personajeFondo" src="20_soles-removebg-preview.png" alt="Personaje Histórico" class="w-[94%] h-auto object-contain">
      <!-- Botón X en la esquina del billete -->
      <button id="btnCerrarX" class="absolute top-2 right-[5%] text-white/80 hover:text-white bg-black/20 rounded-full p-1 z-10">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <!-- Tarjeta Principal Blanca -->
    <div class="bg-white rounded-[28px] p-6 shadow-xl text-yapeInk w-[94%] relative overflow-hidden -mt-4">
      
      <!-- Encabezado ¡Yapeaste! (Fucsia Original) y Compartir -->
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-[22px] font-bold text-yapeMagenta tracking-tight">¡Yapeaste!</h2>
        <button class="text-yapeAqua font-bold text-xs flex items-center space-x-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 10.742l4.828-2.414m0 0a3 3 0 10-2.243-4.077L6.44 6.666m6.142 1.662a3 3 0 00c0 1.253-.223 2.454-.64 3.563m0 0a3 3 0 102.243 4.077L14.63 12m0 0a3 3 0 00-1.253-1.243"></path></svg>
          <span>Compartir</span>
        </button>
      </div>

      <!-- Sección del Monto (Morado Real y grosor estilizado) -->
      <div class="flex items-baseline mb-2">
        <span class="text-yapeInk text-3xl font-bold mr-1.5 select-none">S/</span>
        <span id="montoFinal" class="text-yapeInk text-[52px] font-bold tracking-tight leading-none">0</span>
      </div>

      <!-- Nombre del Destinatario (Morado Real) -->
      <p id="nombreDestinatario" class="text-lg font-bold text-yapeInk mb-4">Daniel Dav*</p>

      <!-- Fecha y Hora con iconos -->
      <div class="flex items-center space-x-4 text-xs text-yapeGray font-semibold mb-5 border-b border-gray-100 pb-5">
        <span class="flex items-center">
          <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          <span id="fechaTexto">13 jul. 2026</span>
        </span>
        <span class="flex items-center">
          <svg class="w-3.5 h-3.5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span id="horaTexto">06:01 p. m.</span>
        </span>
      </div>

      <!-- Código de Seguridad -->
      <div class="flex items-center justify-between border-b border-gray-100 pb-5 mb-5">
        <span class="text-[10px] font-bold text-yapeGray tracking-wider uppercase flex items-center">
          Código de seguridad 
          <span class="ml-1.5 bg-yapeAqua text-white rounded-full w-3.5 h-3.5 flex items-center justify-center text-[8px] font-black">i</span>
        </span>
        <div class="flex space-x-1">
          <span id="cod1" class="bg-gray-100 text-yapeInk font-bold text-xs px-2.5 py-1 rounded-md">1</span>
          <span id="cod2" class="bg-gray-100 text-yapeInk font-bold text-xs px-2.5 py-1 rounded-md">6</span>
          <span id="cod3" class="bg-gray-100 text-yapeInk font-bold text-xs px-2.5 py-1 rounded-md">1</span>
        </div>
      </div>

      <!-- Datos de la transacción -->
      <div class="space-y-3">
        <p class="text-[10px] font-bold text-yapeGray tracking-wider uppercase">Datos de la transacción</p>
        
        <div class="flex justify-between text-xs font-semibold">
          <span class="text-yapeGray">Nro. de celular</span>
          <span id="celularDestinatario" class="text-yapeInk font-bold">008</span>
        </div>
        <div class="flex justify-between text-xs font-semibold">
          <span class="text-yapeGray">Destino</span>
          <span class="text-yapeInk font-bold">Yape</span>
        </div>
        <div class="flex justify-between text-xs font-semibold">
          <span class="text-yapeGray">Nro. de operación</span>
          <span id="numOperacion" class="text-yapeInk font-bold">43600540</span>
        </div>
      </div>

    </div>

    <!-- Botones de Acción -->
    <button id="btnNuevoYapeo" class="w-[94%] bg-[#00D4AF] hover:bg-[#00bda0] text-[#311443] font-bold py-3.5 px-4 rounded-2xl flex items-center justify-center space-x-2 text-sm shadow-md transition duration-200">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
      <span>Nuevo Yapeo</span>
    </button>

    <button id="btnAyuda" class="w-[94%] bg-white/10 hover:bg-white/20 text-white font-semibold py-3 px-4 rounded-2xl flex items-center justify-center space-x-2 text-xs">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
      <span>Necesito ayuda</span>
    </button>

    <!-- SECCIÓN PUBLICITARIA FLOTANTE -->
    <div class="rounded-3xl overflow-hidden p-5 bg-[#4A1153] shadow-md mt-4 w-[94%]">
      <div class="text-xs font-bold text-white mb-3 flex justify-between items-center">
        <span>Más en Yape</span>
        <span class="text-black bg-yellow-400 px-1.5 py-0.5 text-[9px] rounded uppercase font-black">Nuevo</span>
      </div>
      <div class="rounded-2xl overflow-hidden">
        <img src="https://i.postimg.cc/W3DvJwTz/6.webp" alt="Publicidad Yape" class="w-full h-auto object-cover">
      </div>
    </div>

  </div>

  <!-- LÓGICA DE CONTROL -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      
      const btnYapear = document.getElementById("btnYapear");
      const btnNuevoYapeo = document.getElementById("btnNuevoYapeo");
      const btnCerrarX = document.getElementById("btnCerrarX");

      if (btnYapear) {
        btnYapear.addEventListener("click", () => {
          const inputMontoVal = document.getElementById("inputMonto").value;
          const inputMonto = parseFloat(inputMontoVal) || 0;
          const inputNombre = document.getElementById("inputNombre").value;
          const inputCelular = document.getElementById("inputCelular").value;

          const txtMontoFinal = document.getElementById("montoFinal");
          const txtNombreDestinatario = document.getElementById("nombreDestinatario");
          const txtCelularDestinatario = document.getElementById("celularDestinatario");
          const txtFechaTexto = document.getElementById("fechaTexto");
          const txtHoraTexto = document.getElementById("horaTexto");
          const txtNumOperacion = document.getElementById("numOperacion");
          const imgPersonaje = document.getElementById("personajeFondo");

          const txtCod1 = document.getElementById("cod1");
          const txtCod2 = document.getElementById("cod2");
          const txtCod3 = document.getElementById("cod3");

          // 1. Mostrar Monto dinámicamente (si es entero, no lleva .00 tal como el original "S/ 20")
          if (inputMonto % 1 === 0) {
            txtMontoFinal.textContent = inputMonto.toString();
          } else {
            txtMontoFinal.textContent = inputMonto.toFixed(2);
          }

          // 2. Lógica Dinámica de Personajes según el Monto
          if (inputMonto >= 0.1 && inputMonto <= 19.99) {
            imgPersonaje.src = "10_soles-removebg-preview.png"; // José Quiñones
          } else if (inputMonto >= 20.00 && inputMonto <= 49.99) {
            imgPersonaje.src = "20_soles-removebg-preview.png"; // Miguel Grau
          } else if (inputMonto >= 50.00 && inputMonto <= 99.99) {
            imgPersonaje.src = "50_soles-removebg-preview.png"; // Abraham Valdelomar
          } else if (inputMonto >= 100.00 && inputMonto <= 199.99) {
            imgPersonaje.src = "100_soles-removebg-preview.png"; // Pedro Paulet
          } else if (inputMonto >= 200.00) {
            imgPersonaje.src = "200_soles-removebg-preview.png"; // Santa Rosa de Lima
          } else {
            imgPersonaje.src = "10_soles-removebg-preview.png";
          }

          // 3. Pintar Datos del Destinatario
          txtNombreDestinatario.textContent = inputNombre.trim() !== "" ? inputNombre : "Daniel Dav*";
          txtCelularDestinatario.textContent = inputCelular.trim() !== "" ? inputCelular : "008";

          // 4. Generar Fecha y Hora Actual
          const ahora = new Date();
          const meses = ["ene.", "feb.", "mar.", "abr.", "may.", "jun.", "jul.", "ago.", "set.", "oct.", "nov.", "dic."];
          const dia = ahora.getDate();
          const mes = meses[ahora.getMonth()];
          const anio = ahora.getFullYear();
          
          let horas = ahora.getHours();
          const minutos = String(ahora.getMinutes()).padStart(2, '0');
          const ampm = horas >= 12 ? 'p. m.' : 'a. m.';
          horas = horas % 12;
          horas = horas ? horas : 12;
          const horasFormateadas = String(horas).padStart(2, '0');

          txtFechaTexto.textContent = `${dia} ${mes} ${anio}`;
          txtHoraTexto.textContent = `${horasFormateadas}:${minutos} ${ampm}`;

          // 5. Generar Número de Operación aleatorio de 8 dígitos
          const numOpAzar = Math.floor(10000000 + Math.random() * 90000000);
          txtNumOperacion.textContent = numOpAzar;

          // 6. Códigos de seguridad dinámicos
          txtCod1.textContent = Math.floor(Math.random() * 10);
          txtCod2.textContent = Math.floor(Math.random() * 10);
          txtCod3.textContent = Math.floor(Math.random() * 10);

          // 7. Cambiar Pantallas
          document.getElementById("seccionFormulario").classList.add("hidden");
          document.getElementById("seccionRecibo").classList.remove("hidden");
        });
      }

      const regresarAlFormulario = () => {
        document.getElementById("inputMonto").value = "";
        document.getElementById("inputNombre").value = "";
        document.getElementById("inputCelular").value = "";
        document.getElementById("seccionRecibo").classList.add("hidden");
        document.getElementById("seccionFormulario").classList.remove("hidden");
      };

      if (btnNuevoYapeo) btnNuevoYapeo.addEventListener("click", regresarAlFormulario);
      if (btnCerrarX) btnCerrarX.addEventListener("click", regresarAlFormulario);

    });
  </script>
</body>
</html>

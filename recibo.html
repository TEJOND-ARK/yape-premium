<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Yape - Comprobante</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            yape: "#7B2E83",
            yapeDark: "#5C1C6A",
            yapeMint: "#10cbb4",
            yapeInk: "#3D3556",
            yapeGray: "#f3f4f6"
          }
        }
      }
    }
  </script>
  <style>
    body {
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-[#7B2E83] min-h-screen flex flex-col items-center justify-start pt-4 px-4 select-none">

  <!-- CONTENEDOR DEL RECIBO EXACTO DE YAPE -->
  <div class="w-full max-w-sm bg-white rounded-3xl shadow-2xl overflow-hidden p-6 flex flex-col items-center relative">
    
    <!-- Botón discreto para retroceder al panel si lo necesitas -->
    <button onclick="window.location.href='index.html'" class="absolute top-4 left-4 text-gray-300 hover:text-gray-500 transition text-xl">
      ←
    </button>

    <!-- Círculo de Éxito de Yape -->
    <div class="w-16 h-16 bg-[#10cbb4] rounded-full flex items-center justify-center mt-3 mb-2 shadow-lg shadow-yapeMint/10 animate-bounce">
      <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
      </svg>
    </div>

    <!-- Título Principal -->
    <h2 class="text-lg font-extrabold text-[#3D3556] tracking-tight">¡Yapeaste!</h2>
    
    <!-- Monto de Dinero en formato gigante -->
    <div class="text-4xl font-black text-[#3D3556] my-3 flex items-start">
      <span class="text-lg font-extrabold mt-1 mr-0.5">S/</span>
      <span id="reciboMonto" class="tracking-tight">0.00</span>
    </div>

    <!-- Destinatario del Yapeo -->
    <div class="text-base font-extrabold text-[#3D3556] text-center mt-1 uppercase tracking-tight" id="reciboNombre">
      Cargando...
    </div>

    <!-- Celular formateado -->
    <div class="text-xs text-gray-400 font-bold mt-0.5 tracking-wider" id="reciboNumero">
      *** *** ***
    </div>

    <!-- Separador Estético Punteado (Típico del Voucher) -->
    <div class="w-full border-t-2 border-dashed border-gray-100 my-5"></div>

    <!-- Tabla con Información del Pago -->
    <div class="w-full space-y-3.5 text-xs">
      <div class="flex justify-between items-center">
        <span class="text-gray-400 font-bold tracking-tight">Fecha de pago</span>
        <span class="text-[#3D3556] font-extrabold" id="reciboFecha">-- --- ----</span>
      </div>
      <div class="flex justify-between items-center">
        <span class="text-gray-400 font-bold tracking-tight">Hora de pago</span>
        <span class="text-[#3D3556] font-extrabold" id="reciboHora">--:-- --</span>
      </div>
      <div class="flex justify-between items-center">
        <span class="text-gray-400 font-bold tracking-tight">Destino</span>
        <span class="text-[#3D3556] font-extrabold">Yape</span>
      </div>
      <div class="flex justify-between items-center">
        <span class="text-gray-400 font-bold tracking-tight">Número de operación</span>
        <span class="text-[#3D3556] font-extrabold" id="reciboOperacion">--------</span>
      </div>
    </div>

    <!-- Botón Principal: Compartir o Volver -->
    <div class="w-full mt-7">
      <button onclick="window.location.href='index.html'" class="w-full bg-[#10cbb4] hover:bg-[#0eb39e] text-white py-3.5 rounded-2xl font-black text-sm tracking-wide transition shadow-md active:scale-95 flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z" />
        </svg>
        Compartir comprobante
      </button>
    </div>

  </div>

  <!-- Texto de ayuda inferior característico de Yape -->
  <p class="text-white/60 text-[10px] font-bold mt-5 tracking-wide text-center uppercase">
    ¿Necesitas ayuda? Comunícate con nuestro canal de soporte.
  </p>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Leemos directamente del localStorage (los datos guardados del panel principal)
      const nombre = localStorage.getItem("yape_nombre");
      const numero = localStorage.getItem("yape_numero");
      const monto = localStorage.getItem("yape_monto");
      const operacion = localStorage.getItem("yape_operacion");
      const fecha = localStorage.getItem("yape_fecha");
      const hora = localStorage.getItem("yape_hora");

      // Si no existen datos guardados en memoria local, te regresa al formulario
      if (!nombre || !monto) {
        alert("Primero configura los datos en el panel.");
        window.location.href = "index.html";
        return;
      }

      // Rellenamos dinámicamente los elementos HTML del comprobante de Yape
      document.getElementById("reciboNombre").textContent = nombre;
      document.getElementById("reciboNumero").textContent = formatearNumeroCelular(numero);
      document.getElementById("reciboMonto").textContent = monto;
      document.getElementById("reciboOperacion").textContent = operacion || "39105820";
      document.getElementById("reciboFecha").textContent = fecha || "Hoy";
      document.getElementById("reciboHora").textContent = hora || "Ahora";
    });

    // Esta función da el espacio clásico al celular: de "963776452" a "963 776 452"
    function formatearNumeroCelular(numStr) {
      if(!numStr) return "*** *** ***";
      let limpio = numStr.replace(/\s+/g, ''); 
      if(limpio.length === 9) {
        return `${limpio.substring(0,3)} ${limpio.substring(3,6)} ${limpio.substring(6,9)}`;
      }
      return numStr;
    }
  </script>
</body>
</html>
